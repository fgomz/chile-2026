<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chile 2026 · Boda & Viaje</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#0F1E33; --ink2:#43556B; --muted:#5A6B80; --line:#E4EAF2; --line2:#D5DEE9;
  --navy:#0F1E33; --navy2:#1E3757; --navy3:#17304F; --sky:#C9D6E6;
  --red:#D7372F; --red-d:#A82620; --red-bg:#FCE9E7; --red-ink:#8F1F19;
  --sun:#FFC93C; --sun-bg:#FFF4D1; --ok:#2F7D4F;
  --r:20px; --shadow:0 1px 2px rgba(15,30,51,.06),0 8px 24px rgba(15,30,51,.06);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:var(--red)} a:hover{color:var(--red-d)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* header */
header{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header .mtn{position:absolute;right:0;bottom:0;width:70%;height:200px;pointer-events:none}
header .wrap{position:relative;padding-top:24px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--red);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:15px}
.lang{display:flex;gap:4px;background:var(--navy2);border-radius:999px;padding:4px}
.lang button{border:0;background:transparent;color:#fff;padding:8px 14px;min-height:36px;border-radius:999px;font-weight:700;font-size:13px}
.lang button.on{background:#fff;color:var(--navy)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.hero-txt{display:flex;flex-direction:column;gap:12px;max-width:640px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
header h1{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.02em}
.sub{font-size:17px;color:var(--sky)}
.count{display:flex;align-items:center;gap:14px;background:var(--sun);color:var(--navy);border-radius:18px;padding:14px 20px}
.count .num{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.count .lbl{font-size:13px;font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--sky);padding:12px 18px;border-radius:14px 14px 0 0;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:44px}
nav.tabs button svg{width:18px;height:18px;flex-shrink:0}
nav.tabs button .s{display:none}
nav.tabs button.on{background:var(--bg);color:var(--ink);font-weight:700}

main.wrap{padding-top:28px;padding-bottom:64px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.card+.card{margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.notice{background:#FFF8E1;border:1px solid #F3DC9A;border-radius:16px;padding:14px 16px;margin-bottom:18px}
.notice.err{background:var(--red-bg);border-color:#F2B8B3}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--red-d)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red-d)}
.btn:disabled{opacity:.5;cursor:default}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h2row h2{font-size:26px}

/* who's where */
.who-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.tlcard{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
#daypanel{flex:1 1 320px;min-width:280px}
#daypanel:empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;font-weight:600;min-height:36px;text-decoration:none;color:var(--ink)}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block}
.chip.all{padding-left:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table.tl{border-collapse:separate;border-spacing:0;min-width:100%}
table.tl th,table.tl td{padding:0;height:52px;border-bottom:1px solid #EEF2F7}
table.tl thead th{background:#F8FAFC;border-bottom:1px solid var(--line)}
table.tl th.day{min-width:38px;width:38px;font-size:11px;font-weight:600;color:var(--ink);text-align:center;cursor:pointer;line-height:1.15;user-select:none;vertical-align:middle}
table.tl th.day b{display:block;font-size:15px;font-weight:700}
table.tl th.day.we{background:#EEF2F7}
table.tl th.day.wed{background:var(--sun);border-radius:10px 10px 0 0}
table.tl th.day.sel{box-shadow:inset 0 -3px 0 var(--red)}
table.tl .name{position:sticky;left:0;background:#fff;z-index:2;min-width:150px;max-width:170px;padding:0 12px;text-align:left;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tl thead .name{background:#F8FAFC;font-size:12px;color:var(--muted)}
table.tl .name .av{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:10px;vertical-align:middle}
table.tl td.wedcol{background:var(--sun-bg)}
table.tl tr.cnt td{height:64px;vertical-align:bottom}
table.tl tr.cnt .name{vertical-align:bottom;padding-bottom:10px;white-space:normal}
.cntcell{text-align:center;padding-bottom:8px !important}
.cntcell .n{display:block;font-size:11px;font-weight:700;color:var(--ink)}
.cntlbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:none}
.cntsel{max-width:100%;border:1px solid var(--line2);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;background:#fff;color:var(--ink)}
.cntcell .b{display:inline-block;width:18px;border-radius:5px 5px 2px 2px;background:#F2A49E}
.cntcell .b.w{background:var(--red)}
td.seg{padding:9px 2px !important}
.bar{height:34px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.dark{color:var(--navy)}
.bar.dim{opacity:.18}
tr.me .name{color:var(--red-d)}
.name .edit{border:0;background:none;color:var(--muted);padding:0 0 0 6px;font-size:13px;min-height:32px}
.daypanel{display:flex;flex-direction:column;gap:16px}
.daypanel .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A5A00}
.daypanel h3{font-size:26px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .gh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.grp .gh span:first-child{display:inline-flex;align-items:center;gap:8px}
.grp .gh i{width:12px;height:12px;border-radius:50%;display:inline-block}
.grp .gh .c{font-size:13px;color:var(--muted)}
.grp .ppl{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--red-bg);color:var(--red-ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.pill.other{background:#EEF2F7;color:var(--ink)}
.empty{text-align:center;padding:40px 16px}
.name .nm{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.swipe{display:none;margin:0;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
#plist{margin-top:24px}
#plist:empty{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.me{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.pcard .ph{display:flex;align-items:center;gap:10px}
.pcard .ph b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .av{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;align-items:center;justify-content:center;flex-shrink:0}
.pcard .edit{border:0;background:#F3F6FA;border-radius:10px;width:36px;height:36px;color:var(--muted)}
.pcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pcard li{display:flex;gap:10px;align-items:flex-start}
.pcard li i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.pcard li div{display:flex;flex-direction:column;min-width:0}
.pcard .pl{font-weight:700}
.pcard .dt{font-size:14px;color:var(--ink2)}
.pcard .nt{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}


/* gantt */
.gctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.segs{display:inline-flex;background:#EEF2F7;border-radius:12px;padding:4px;gap:2px}
.seg{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--muted);min-height:38px}
.seg.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(15,30,51,.12)}
.btn.zoom{min-height:40px;padding:8px 14px}
.g-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff;-webkit-overflow-scrolling:touch}
.g-inner{position:relative}
.g-ov{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.g-ov>div{position:absolute;top:0;bottom:0}
.g-we{background:#F3F6FA}
.g-wed{background:var(--sun-bg)}
.g-sel{box-shadow:inset 0 0 0 2px rgba(215,55,47,.35)}
.g-today{width:2px;margin-left:-1px;background:var(--red)}
.g-row{display:flex;border-bottom:1px solid #EEF2F7;position:relative}
.g-row:last-child{border-bottom:0}
.g-lab{position:sticky;left:0;z-index:3;background:#fff;flex-shrink:0;display:flex;align-items:center;padding:0 8px 0 12px;font-weight:600;font-size:14px;min-width:0;border-right:1px solid var(--line)}
.g-lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.g-name{display:flex;align-items:center;gap:4px;min-width:0;width:100%}
.g-name .edit{border:0;background:none;color:var(--muted);font-size:13px;min-height:32px;padding:0 4px;flex-shrink:0}
.g-row.me .g-lab{color:var(--red-d)}
.g-track{position:relative;flex-shrink:0;z-index:1;cursor:pointer}
.g-head{border-bottom:1px solid var(--line)}
.g-head .g-lab,.g-head .g-track{background:#F8FAFC}
.g-head .g-track{background:transparent}
.g-tick{position:absolute;bottom:0;top:16px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--ink);font-size:11px}
.g-tick b{font-size:13px}
.g-tick .wd{font-size:10px;color:var(--muted);font-weight:600}
.g-tick.wed{background:var(--sun);border-radius:8px 8px 0 0}
.g-tick.sel b{color:var(--red-d)}
.g-month{position:absolute;top:2px;font-size:11px;font-weight:700;text-transform:capitalize;color:var(--muted);white-space:nowrap}
.g-count .g-lab{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.g-cnt{position:absolute;bottom:6px;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none}
.g-cnt span{font-size:10px;font-weight:700}
.g-cnt i{display:block;border-radius:4px 4px 1px 1px}
.g-bar{position:absolute;border:0;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(15,30,51,.15)}
.g-bar.dark{color:var(--navy)}
.g-bar.dim{opacity:.18}
.g-bar.picked{outline:3px solid var(--navy);outline-offset:1px;z-index:2}
.g-out{position:absolute;display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;pointer-events:none}
.g-group{display:flex;background:#F8FAFC;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.g-glab{background:#F8FAFC;font-weight:700;gap:8px;padding-top:10px;padding-bottom:10px;width:auto !important;min-width:var(--lw);border-right:0;position:sticky}
.g-glab i{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.g-glab span{white-space:nowrap}
.g-glab em{font-style:normal;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px}
.gpop{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 10px 10px 14px}
.gpop>i{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.gpop .gp-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.gpop .gp-txt span{font-size:14px;color:var(--sky)}
.gpop .btn{background:transparent;color:#fff;border-color:#3A5578;min-height:40px;padding:6px 12px}
#gpop:empty{display:none}
@media (max-width:720px){ .g-lab{padding:0 4px 0 8px;font-size:13px} .seg{padding:8px 10px} }


/* month calendar */
.months{display:flex;flex-direction:column;gap:22px}
.mtitle{font-size:20px;margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mwd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.mc{min-height:92px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 7px;display:flex;flex-direction:column;gap:5px;text-align:left;align-items:stretch;min-width:0}
button.mc:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.mc.blank{border:0;background:transparent}
.mc.out{background:transparent;border-style:dashed;color:#A9B4C2}
.mc.we:not(.wed){background:#F8FAFC}
.mc.wed{background:var(--sun-bg);border-color:#F0C75A}
.mc.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.mc.today .mtop b{background:var(--red);color:#fff;border-radius:999px;padding:0 6px}
.mtop{display:flex;align-items:center;justify-content:space-between}
.mtop b{font-size:14px}
.mring{width:16px;height:16px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 4px var(--sun),inset 0 0 0 6px var(--navy)}
.mcities{display:flex;flex-direction:column;gap:3px;min-width:0}
.mcity{display:flex;align-items:center;gap:5px;font-size:12px;min-width:0}
.mcity i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mcity .ms{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);flex:1;min-width:0}
.mcity em{font-style:normal;font-weight:800;font-size:12px;color:var(--ink)}
.more{font-size:11px;color:var(--muted);font-weight:700}
@media (max-width:720px){
  .mgrid{gap:3px}
  .mc{min-height:64px;padding:4px 3px;border-radius:9px;gap:3px}
  .mtop b{font-size:12px}
  .mring{width:12px;height:12px;box-shadow:inset 0 0 0 3px var(--sun),inset 0 0 0 5px var(--navy)}
  .mcity{gap:3px;justify-content:center}
  .mcity .ms{display:none}
  .mcity i{width:7px;height:7px}
  .mcity em{font-size:11px}
  .segs{width:100%}
  .seg{flex:1}
}

.dp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dp-nav{display:flex;gap:6px;flex-shrink:0}
.dp-nav .btn{padding:8px 12px;min-width:44px}
.dp-sum{display:flex;flex-wrap:wrap;gap:6px}
.dp-sum .chip{min-height:30px;padding:4px 10px 4px 8px;font-size:13px}
.dp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dp-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #EEF2F7}
.dp-list li.none{opacity:.6}
.dp-list .av{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;align-items:center;justify-content:center;flex-shrink:0}
.dp-who{display:flex;flex-direction:column;gap:2px;min-width:0}
.dp-stop{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.dp-stop i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dp-stop strong{color:var(--ink)}
#daypanel{scroll-margin-top:12px}

#meet{margin-top:24px}
#meet:empty{display:none}
.meet{display:flex;flex-direction:column;gap:14px}
.meetsel{border:1px solid #C8D3E1;border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700;background:#fff;max-width:100%}
.meetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.meetcity{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.meetcity .mh{display:flex;align-items:center;gap:8px}
.meetcity .mh i{width:12px;height:12px;border-radius:50%}
.meetcity ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.meetcity li{display:flex;align-items:center;gap:8px;font-size:14px}
.meetcity .av{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--line);font-size:11px;font-weight:700;align-items:center;justify-content:center;flex-shrink:0}
.meetcity .mn{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meetcity .md{color:var(--ink2);white-space:nowrap}
.meetcity em{font-style:normal;font-size:12px;font-weight:700;background:#EEF2F7;border-radius:999px;padding:1px 8px;white-space:nowrap}
.nmbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;text-align:left;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;min-height:32px}
.mcity.names{align-items:flex-start}
.mcity.names i{margin-top:4px}
.mi{display:flex;flex-wrap:wrap;gap:2px 4px;min-width:0}
.mi span{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.mi .pl{color:var(--muted)}

.pcard .warn{font-size:13px;font-weight:700;color:var(--red-d);background:var(--red-bg);border-radius:8px;padding:2px 8px;align-self:flex-start;margin-top:2px}

/* editor */
.stop{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr auto;gap:10px;align-items:end;padding:14px;margin:10px 0;border-radius:16px;background:#F8FAFC;border:1px solid var(--line)}
.stop label,.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.stop input,.field input,.field select,.mbox textarea{width:100%;border:1px solid #C8D3E1;border-radius:12px;padding:10px 12px;background:#fff;min-height:44px}
.stop .x{border:0;background:#EEF2F7;color:var(--muted);font-size:20px;width:44px;height:44px;border-radius:12px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.saved{color:var(--ok);font-weight:700}

/* guide */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.g{background:#fff;border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);padding:0}
.g .gb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.g h3{font-size:21px}
.g .tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--red-d);font-weight:700}
.g ul{margin:2px 0 0;padding-left:18px;color:var(--ink2)}
.g li{margin:2px 0}
.g .gb>span:not(.tag):not(.small){color:var(--ink2)}
.g .tip{font-size:13px;background:var(--sun-bg);border-radius:12px;padding:8px 12px;margin-top:auto;color:#5C4300}
.g img.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:#F7DCC8}
.g .addr{text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cards.tight{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.cards.tight .g .gb{padding:16px}
.sec{margin:36px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec:first-child{margin-top:8px}
.sec h2{font-size:clamp(28px,4vw,40px)}
.sec .emoji{font-size:30px}
.catnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.catnav a{text-decoration:none;color:var(--ink)}
.card .dish,.dish{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.dish span{background:var(--red-bg);color:var(--red-ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.subh{font-family:"Instrument Sans",system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dc{background:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;gap:12px;padding:10px;align-items:flex-start;min-height:96px}
.dc .dph{width:84px;height:84px;flex-shrink:0;border-radius:12px;object-fit:cover;cursor:zoom-in;background:#F7DCC8}
.dc .dph.none{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:30px;color:var(--red-ink);background:var(--red-bg);cursor:default}
.dc .db{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:2px}
.dc .db b{font-size:16px}
.dc .db span{font-size:14px;color:var(--ink2);line-height:1.4}
.dc .dtip{font-size:13px !important;color:#5C4300 !important;background:var(--sun-bg);border-radius:8px;padding:3px 8px;align-self:flex-start;margin-top:2px}
.dc.addcard{justify-content:center;align-items:center;border:2px dashed var(--line2);background:transparent;box-shadow:none;color:var(--muted);font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:14px;padding:0 14px;margin-bottom:18px;color:var(--muted);box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:transparent;min-height:50px;font-size:16px;color:var(--ink)}
.disclaimer{font-size:13px;color:var(--muted);margin-top:28px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 20px 28px}

@media (max-width:720px){
  .wrap{padding:0 16px}
  header .wrap{padding-top:18px;gap:16px}
  header .mtn{width:100%;height:120px}
  .sub{font-size:15px}
  .count{padding:10px 14px;width:100%}
  .count .num{font-size:24px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:4px 2px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs button{flex-direction:column;gap:2px;border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted)}
  nav.tabs button .l{display:none}
  nav.tabs button .s{display:block}
  nav.tabs button.on{background:transparent;color:var(--ink)}
  nav.tabs button.on svg{color:var(--red)}
  main.wrap{padding-top:18px;padding-bottom:110px}
  footer{padding-bottom:100px}
  .card{padding:16px}
  .stop{grid-template-columns:minmax(0,1fr) 44px;gap:10px;padding:12px}
  .stop>div{min-width:0;grid-column:1/-1}
  .stop .p{grid-column:1;grid-row:1}
  .stop .x{grid-column:2;grid-row:1;align-self:end;justify-self:end}
  .stop input{box-sizing:border-box;width:100%;min-width:0;max-width:100%}
  .stop input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left;min-height:44px;line-height:22px}
  .stop input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
  .grid2{grid-template-columns:1fr}
  table.tl .name{min-width:0;width:84px;padding:0 6px 0 10px}
  table.tl .name .av,table.tl .name .edit,.cntlbl{display:none}
  .name .nm{max-width:72px;font-size:13px}
  .cntsel{max-width:74px;font-size:12px;padding:3px 2px}
  table.tl th.day{min-width:34px;width:34px}
  .bar{font-size:12px;padding:0 6px}
  .swipe{display:block}
}
.edbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px;position:sticky;top:8px;z-index:5}
.ctl{display:inline-flex;gap:4px;margin-left:auto}
.ctl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:13px}
.ctl button:disabled{opacity:.35}
.ictl{margin-top:8px;margin-left:0}
.g .addr{text-decoration:none}
.addcard{border:2px dashed var(--line2);box-shadow:none;background:transparent;color:var(--muted);min-height:120px;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.mo{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.mbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:720px}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox textarea{resize:vertical}
.phbox{display:flex;flex-direction:column;gap:8px}
.phbox img{max-width:260px;border-radius:10px;aspect-ratio:auto}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>

<main class="wrap">
  <section class="view" id="v-who">
    <div id="who-status"></div>

      <div class="card tlcard">
        <div class="h2row" style="margin:0"><h2 data-i="whoTitle"></h2><button class="btn primary" id="addMine" data-i="addMine"></button></div>

/* ============ helpers ============ */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){

const fmtDay = s => parse(s).toLocaleDateString(lang==='es'?'es-CL':'en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});

/* ============ places & colors ============ */
const KNOWN = [
  ["Santiago","#D7372F"],["Valparaíso","#157272"],["Viña del Mar","#2B9FB0"],["Cajón del Maipo","#3B7A3A"],

const PALETTE = ["#E07A5F","#3D405B","#81B29A","#B5838D","#6D597A","#457B9D","#A8763E","#588157","#BC4749","#264653","#F4A259","#7F5539"];
function isLight(hex){ const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return false; const n=parseInt(m[1],16); const r=n>>16&255,g=n>>8&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>165; }
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function colorFor(place){
  const n=norm(place);
  for(const [p,c] of KNOWN){ const pn=norm(p); if(n===pn || (n.length>3 && pn.includes(n)) || (pn.length>3 && n.includes(pn.split(' ')[0]) && pn.split(' ')[0].length>4)) return c; }

const isSantiago = p => norm(p).startsWith('santiago') || norm(p)==='stgo';

const cfg = () => {
  const C=S.config||{};
  const weddingDate = isDate(C.weddingDate)?C.weddingDate:null;
  let weddingEnd = (isDate(C.weddingEnd) && weddingDate && C.weddingEnd>=weddingDate) ? C.weddingEnd : null;

  if(!weddingEnd && weddingDate && isDate(C.start) && isDate(C.end) && C.start<=weddingDate && C.end>=weddingDate && (parse(C.end)-parse(C.start))/864e5<=4) weddingEnd=C.end;
  return { weddingDate, weddingEnd: weddingEnd||weddingDate, weddingPlace: typeof C.weddingPlace==='string'?C.weddingPlace:'' };
};
const isWed = (c,d) => !!c.weddingDate && d>=c.weddingDate && d<=c.weddingEnd;
const addDays = (d,n) => iso(new Date(parse(d).getTime()+n*864e5));
// the calendar range is derived from the data: first arrival to last departure (plus the wedding days)
// reference date for "is this stop plausibly part of the trip?": the wedding, else the median start date
function refDate(c, trips){
  if(c.weddingDate) return c.weddingDate;
  const f=[]; trips.forEach(tr=>tr.stops.forEach(st=>{ if(isDate(st.from)) f.push(st.from); })); f.sort();
  return f.length? f[Math.floor(f.length/2)] : null;
}
function isOutlier(st, ref){ if(!ref || !isDate(st.from) || !isDate(st.to)) return false; return st.to < addDays(ref,-120) || st.from > addDays(ref,120); }
function viewDays(c, trips){
  const ref=refDate(c,trips);
  let a=null,b=null; const see=(x,y)=>{ if(isDate(x)&&(!a||x<a)) a=x; if(isDate(y)&&(!b||y>b)) b=y; };
  trips.forEach(tr=>tr.stops.forEach(st=>{ if(st.place&&st.from&&st.to&&!isOutlier(st,ref)) see(st.from,st.to); }));
  if(c.weddingDate) see(c.weddingDate,c.weddingEnd);
  if(!a){ a='2026-12-01'; b='2026-12-31'; }
  if((parse(b)-parse(a))/864e5>118) b=addDays(a,118);
  return dayList(a,b);
}
function fullWeekDays(days){
  if(!days.length) return days;
  const a=days[0], b=days[days.length-1];
  return dayList(addDays(a,-((parse(a).getUTCDay()+6)%7)), addDays(b,(7-parse(b).getUTCDay())%7));
}
const fixYear = d => (isDate(d) && +d.slice(0,4) < 2000) ? ((isDate(S.config&&S.config.weddingDate)? S.config.weddingDate.slice(0,4) : '2026') + d.slice(4)) : d;

  const sel=el('select',{class:'meetsel','aria-label':t('meetTitle'),onchange:e=>{ S.meet=e.target.value; renderMeet(trips); }}, withStops.map(tr=>el('option',{value:tr.id,selected:tr.id===me.id},tr.name||'—')));

      const f=a.from>b.from?a.from:b.from, u=a.to<b.to?a.to:b.to; if(f<=u) hits.push({name:o.name||'—',place:a.place,from:f,to:u,n:Math.round((parse(u)-parse(f))/864e5)+1}); })); });

async function save(btn,msg){
  msg.className='small'; msg.textContent='';
  const name=draft.name.trim();
  if(!name){ msg.textContent=t('edErrName'); return; }
  const stops=draft.stops.filter(s=>s.place.trim()||s.from||s.to||s.note.trim()).map(s=>({place:s.place.trim(),from:s.from,to:s.to,note:s.note.trim()}));
  if(stops.some(s=>!s.place||!isDate(s.from)||!isDate(s.to)||s.from>s.to)){ msg.textContent=t('edErrDates'); return; }
  { const ref=refDate(cfg(),[...S.trips.values()].filter(x=>x.id!==S.editingId)); const bad=stops.find(x=>isOutlier(x,ref)); if(bad){ msg.textContent=t('edErrYear')+' '+bad.place+' · '+bad.from; return; } }
  stops.sort((a,b)=>a.from.localeCompare(b.from));
  btn.disabled=true;
  const body={name, stops, updatedAt:new Date().toISOString()};

    await S.db.doc('trips/'+S.editingId).set(body);
    draft.stops=stops.length?stops:[{place:'',from:'',to:'',note:''}];
    dirty=false; msg.className='small saved'; msg.textContent=t('edSaved');
  }catch(e){
    if(e && (e.code==='invalid_argument'||e.code==='permission-denied')){ S.readOnly=true; renderEditor(); return; }
    if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await S.db.doc('trips/'+S.editingId).set(body); msg.className='small saved'; msg.textContent=t('edSaved'); btn.disabled=false; return; }catch(e2){} }
    msg.textContent=t('edFail');
  }
  btn.disabled=false;
}

function modal(title, body, onSave, extra){

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    for(const [max,q] of [[1280,0.78],[1000,0.68],[800,0.6]]){
      const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
      if(b && b.size<600000) return b;
    }
  }catch(e){}
  return file;
}

const FB_VER='10.12.2';
async function makeDb(){
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
  const fdb = F.getFirestore(initializeApp(FIREBASE_CONFIG));
  const wrap = d => ({ id:d.id, exists:d.exists(), data:()=>d.data(), metadata:{fromCache:d.metadata.fromCache, hasPendingWrites:d.metadata.hasPendingWrites} });
  const docRef = path => { const r=F.doc(fdb,path); return {
    id:r.id, path,
    get: async()=>wrap(await F.getDoc(r)),
    set: d=>F.setDoc(r,d), update: d=>F.updateDoc(r,d), delete: ()=>F.deleteDoc(r),
    onSnapshot: (n,e)=>F.onSnapshot(r, s=>n(wrap(s)), e)
  }; };
  const colRef = path => ({
    path,
    doc: id => docRef(path+'/'+(id || F.doc(F.collection(fdb,path)).id)),
    onSnapshot: (n,e)=>F.onSnapshot(F.collection(fdb,path), s=>n({docs:s.docs.map(wrap), size:s.size, empty:s.empty, metadata:{fromCache:s.metadata.fromCache}}), e)
  });
  const db = { doc:docRef, collection:colRef };
  const toDataURL = blob => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
  const assets = {
    upload: async (blob)=>{ const data=await toDataURL(blob); if(data.length>950000) throw {code:'too_large'}; const ref=colRef('photos').doc(); await ref.set({data, createdAt:Date.now()}); PH.set(ref.id, Promise.resolve(data)); return {id:ref.id}; },
    delete: async (id)=>{ if(isAssetId(id)) await docRef('photos/'+id).delete(); PH.delete(id); return {deleted:true}; }
  };
  return {db, assets};
}

async function initData(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('PEGA')){ S.dbState='nodb'; renderAll(); return; }
  let slowTimer = setTimeout(()=>{ if(S.dbState==='loading'){ S.dbState='slow'; renderWho(); renderEditor(); renderGuide('see'); renderGuide('eat'); renderGuide('tips'); } }, 10000);
  let db, assets;
  try{ ({db,assets} = await makeDb()); }catch(e){ console.error(e); clearTimeout(slowTimer); S.dbState='nodb'; renderAll(); return; }
  S.db=db; S.assets=assets; S.isOwner=true; S.me=myId();
  renderEditor(); renderSettings();
  let gotTrips=false;
  db.collection('trips').onSnapshot(snap=>{
    S.trips = new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id, cleanTrip(d.id, d.data()||{})]));
    if(!snap.metadata.fromCache){ gotTrips=true; clearTimeout(slowTimer); }
    if(gotTrips || S.trips.size) S.dbState='ready';
    renderWho(); if(!dirty) draftFor=undefined; renderEditorIfIdle();
  }, err=>{ console.error(err); clearTimeout(slowTimer); S.dbState='ready'; renderWho(); renderEditor(); });
  let gotSec=false, gotGuide=false;
  const guideDone=()=>{ if(gotSec&&gotGuide){ S.guideLoaded=true; } renderGuide('see'); renderGuide('eat'); renderGuide('tips'); };
  db.collection('sections').onSnapshot(snap=>{ S.sections=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,Object.assign({},d.data()||{},{id:d.id})])); if(!snap.metadata.fromCache) gotSec=true; guideDone(); }, ()=>{ gotSec=true; guideDone(); });
  db.collection('guide').onSnapshot(snap=>{ S.guide=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,Object.assign({},d.data()||{},{id:d.id})])); if(!snap.metadata.fromCache) gotGuide=true; guideDone(); }, ()=>{ gotGuide=true; guideDone(); });
  db.doc('config/main').onSnapshot(snap=>{ S.config = snap.exists ? (snap.data()||{}) : {}; renderCountdown(); renderWho(); renderSettingsIfIdle(); }, ()=>{});
}
