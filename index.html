<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chile 2026 · Boda & Viaje</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#0F1E33; --ink2:#43556B; --muted:#5A6B80; --line:#E4EAF2; --line2:#D5DEE9;
  --navy:#0F1E33; --navy2:#1E3757; --navy3:#17304F; --sky:#C9D6E6;
  --red:#D7372F; --red-d:#A82620; --red-bg:#FCE9E7; --red-ink:#8F1F19;
  --sun:#FFC93C; --sun-bg:#FFF4D1; --ok:#2F7D4F;
  --r:20px; --shadow:0 1px 2px rgba(15,30,51,.06),0 8px 24px rgba(15,30,51,.06);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:var(--red)} a:hover{color:var(--red-d)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* header */
header{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header .mtn{position:absolute;right:0;bottom:0;width:70%;height:200px;pointer-events:none}
header .wrap{position:relative;padding-top:24px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--red);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:15px}
.lang{display:flex;gap:4px;background:var(--navy2);border-radius:999px;padding:4px}
.lang button{border:0;background:transparent;color:#fff;padding:8px 14px;min-height:36px;border-radius:999px;font-weight:700;font-size:13px}
.lang button.on{background:#fff;color:var(--navy)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.hero-txt{display:flex;flex-direction:column;gap:12px;max-width:640px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
header h1{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.02em}
.sub{font-size:17px;color:var(--sky)}
.count{display:flex;align-items:center;gap:14px;background:var(--sun);color:var(--navy);border-radius:18px;padding:14px 20px}
.count .num{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.count .lbl{font-size:13px;font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--sky);padding:12px 18px;border-radius:14px 14px 0 0;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:44px}
nav.tabs button svg{width:18px;height:18px;flex-shrink:0}
nav.tabs button .s{display:none}
nav.tabs button.on{background:var(--bg);color:var(--ink);font-weight:700}

main.wrap{padding-top:28px;padding-bottom:64px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.card+.card{margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.notice{background:#FFF8E1;border:1px solid #F3DC9A;border-radius:16px;padding:14px 16px;margin-bottom:18px}
.notice.err{background:var(--red-bg);border-color:#F2B8B3}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--red-d)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red-d)}
.btn:disabled{opacity:.5;cursor:default}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h2row h2{font-size:26px}

/* who's where */
.who-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.tlcard{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
#daypanel{flex:1 1 300px;min-width:280px}
#daypanel:empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;font-weight:600;min-height:36px;text-decoration:none;color:var(--ink)}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table.tl{border-collapse:separate;border-spacing:0;min-width:100%}
table.tl th,table.tl td{padding:0;height:52px;border-bottom:1px solid #EEF2F7}
table.tl thead th{background:#F8FAFC;border-bottom:1px solid var(--line)}
table.tl th.day{min-width:38px;width:38px;font-size:11px;font-weight:600;color:var(--ink);text-align:center;cursor:pointer;line-height:1.15;user-select:none;vertical-align:middle}
table.tl th.day b{display:block;font-size:15px;font-weight:700}
table.tl th.day.we{background:#EEF2F7}
table.tl th.day.wed{background:var(--sun);border-radius:10px 10px 0 0}
table.tl th.day.sel{box-shadow:inset 0 -3px 0 var(--red)}
table.tl .name{position:sticky;left:0;background:#fff;z-index:2;min-width:150px;max-width:170px;padding:0 12px;text-align:left;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tl thead .name{background:#F8FAFC;font-size:12px;color:var(--muted)}
table.tl .name .av{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:10px;vertical-align:middle}
table.tl td.wedcol{background:var(--sun-bg)}
table.tl tr.cnt td{height:64px;vertical-align:bottom}
table.tl tr.cnt .name{font-weight:700;color:var(--red-d);font-size:12px;vertical-align:bottom;padding-bottom:12px}
.cntcell{text-align:center;padding-bottom:8px !important}
.cntcell .n{display:block;font-size:11px;font-weight:700;color:var(--red-d)}
.cntcell .b{display:inline-block;width:18px;border-radius:5px 5px 2px 2px;background:#F2A49E}
.cntcell .b.w{background:var(--red)}
td.seg{padding:9px 2px !important}
.bar{height:34px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.dark{color:var(--navy)}
.bar.dim{opacity:.18}
tr.me .name{color:var(--red-d)}
.name .edit{border:0;background:none;color:var(--muted);padding:0 0 0 6px;font-size:13px;min-height:32px}
.daypanel{display:flex;flex-direction:column;gap:16px}
.daypanel .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A5A00}
.daypanel h3{font-size:26px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .gh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.grp .gh span:first-child{display:inline-flex;align-items:center;gap:8px}
.grp .gh i{width:12px;height:12px;border-radius:50%;display:inline-block}
.grp .gh .c{font-size:13px;color:var(--muted)}
.grp .ppl{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--red-bg);color:var(--red-ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.pill.other{background:#EEF2F7;color:var(--ink)}
.empty{text-align:center;padding:40px 16px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* editor */
.stop{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr auto;gap:10px;align-items:end;padding:14px;margin:10px 0;border-radius:16px;background:#F8FAFC;border:1px solid var(--line)}
.stop label,.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.stop input,.field input,.field select,.mbox textarea{width:100%;border:1px solid #C8D3E1;border-radius:12px;padding:10px 12px;background:#fff;min-height:44px}
.stop .x{border:0;background:#EEF2F7;color:var(--muted);font-size:20px;width:44px;height:44px;border-radius:12px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.saved{color:var(--ok);font-weight:700}

/* guide */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.g{background:#fff;border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);padding:0}
.g .gb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.g h3{font-size:21px}
.g .tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--red-d);font-weight:700}
.g ul{margin:2px 0 0;padding-left:18px;color:var(--ink2)}
.g li{margin:2px 0}
.g .gb>span:not(.tag):not(.small){color:var(--ink2)}
.g .tip{font-size:13px;background:var(--sun-bg);border-radius:12px;padding:8px 12px;margin-top:auto;color:#5C4300}
.g img.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:#F7DCC8}
.g .addr{text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cards.tight{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.cards.tight .g .gb{padding:16px}
.sec{margin:36px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec:first-child{margin-top:8px}
.sec h2{font-size:clamp(28px,4vw,40px)}
.sec .emoji{font-size:30px}
.catnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.catnav a{text-decoration:none;color:var(--ink)}
.card .dish,.dish{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.dish span{background:var(--red-bg);color:var(--red-ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.subh{font-family:"Instrument Sans",system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dc{background:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;gap:12px;padding:10px;align-items:flex-start;min-height:96px}
.dc .dph{width:84px;height:84px;flex-shrink:0;border-radius:12px;object-fit:cover;cursor:zoom-in;background:#F7DCC8}
.dc .dph.none{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:30px;color:var(--red-ink);background:var(--red-bg);cursor:default}
.dc .db{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:2px}
.dc .db b{font-size:16px}
.dc .db span{font-size:14px;color:var(--ink2);line-height:1.4}
.dc .dtip{font-size:13px !important;color:#5C4300 !important;background:var(--sun-bg);border-radius:8px;padding:3px 8px;align-self:flex-start;margin-top:2px}
.dc.addcard{justify-content:center;align-items:center;border:2px dashed var(--line2);background:transparent;box-shadow:none;color:var(--muted);font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:14px;padding:0 14px;margin-bottom:18px;color:var(--muted);box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:transparent;min-height:50px;font-size:16px;color:var(--ink)}
.disclaimer{font-size:13px;color:var(--muted);margin-top:28px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 20px 28px}

@media (max-width:720px){
  .wrap{padding:0 16px}
  header .wrap{padding-top:18px;gap:16px}
  header .mtn{width:100%;height:120px}
  .sub{font-size:15px}
  .count{padding:10px 14px;width:100%}
  .count .num{font-size:24px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:4px 2px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs button{flex-direction:column;gap:2px;border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted)}
  nav.tabs button .l{display:none}
  nav.tabs button .s{display:block}
  nav.tabs button.on{background:transparent;color:var(--ink)}
  nav.tabs button.on svg{color:var(--red)}
  main.wrap{padding-top:18px;padding-bottom:110px}
  footer{padding-bottom:100px}
  .card{padding:16px}
  .stop{grid-template-columns:1fr 1fr}
  .stop .p,.stop .n{grid-column:1/-1}
  .stop .x{grid-column:2;justify-self:end}
  .grid2{grid-template-columns:1fr}
  table.tl .name{min-width:96px;max-width:110px;padding:0 8px}
  table.tl .name .av{display:none}
}
.edbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px;position:sticky;top:8px;z-index:5}
.ctl{display:inline-flex;gap:4px;margin-left:auto}
.ctl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:13px}
.ctl button:disabled{opacity:.35}
.ictl{margin-top:8px;margin-left:0}
.g .addr{text-decoration:none}
.addcard{border:2px dashed var(--line2);box-shadow:none;background:transparent;color:var(--muted);min-height:120px;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.mo{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.mbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:720px}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox textarea{resize:vertical}
.phbox{display:flex;flex-direction:column;gap:8px}
.phbox img{max-width:260px;border-radius:10px;aspect-ratio:auto}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<header>
  <svg class="mtn" viewBox="0 0 900 220" preserveAspectRatio="none" aria-hidden="true"><path d="M0 220 L120 120 L190 160 L300 40 L380 120 L470 70 L560 150 L640 95 L760 170 L900 110 L900 220 Z" fill="#17304F"/><path d="M300 40 L330 75 L300 70 L275 78 Z M470 70 L492 95 L468 92 L452 98 Z" fill="#fff" opacity=".85"/></svg>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="logo">26</span><span data-i="brand"></span></div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="es">ES</button><button data-lang="en">EN</button>
      </div>
    </div>
    <div class="hero">
      <div class="hero-txt">
        <div class="kicker" data-i="kicker"></div>
        <h1 data-i="title"></h1>
        <div class="sub" data-i="subtitle"></div>
      </div>
      <div id="countdown"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button data-tab="who"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="l" data-i="tabWho"></span><span class="s" data-i="tabWhoS"></span></button>
      <button data-tab="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="l" data-i="tabMine"></span><span class="s" data-i="tabMineS"></span></button>
      <button data-tab="see"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg><span class="l" data-i="tabSee"></span><span class="s" data-i="tabSeeS"></span></button>
      <button data-tab="eat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg><span class="l" data-i="tabEat"></span><span class="s" data-i="tabEatS"></span></button>
      <button data-tab="tips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span class="l" data-i="tabTips"></span><span class="s" data-i="tabTipsS"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-who">
    <div id="who-status"></div>
    <div class="who-grid">
      <div class="card tlcard">
        <div class="h2row" style="margin:0"><h2 data-i="whoTitle"></h2><button class="btn primary" id="addMine" data-i="addMine"></button></div>
        <div class="legend" id="legend"></div>
        <div class="tl-scroll"><table class="tl" id="tl"></table></div>
        <p class="hint" data-i="whoHint"></p>
      </div>
      <div id="daypanel"></div>
    </div>
  </section>

  <section class="view" id="v-mine">
    <div id="mine-status"></div>
    <div class="card" id="editor"></div>
    <div class="card" id="settings" hidden></div>
  </section>

  <section class="view" id="v-see"><div id="see"></div></section>
  <section class="view" id="v-eat"><div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="eatq" type="search" autocomplete="off" data-ph="search"></div><div id="eat"></div></section>
  <section class="view" id="v-tips"><div id="tips"></div></section>
</main>
<footer data-i="footer"></footer>

<datalist id="places"></datalist>

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='style') n.style.cssText=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if(k==='text') n.textContent=v;
    else n.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}

  ["Valle de Casablanca","#7A4E9E"],["Valle de Colchagua","#8A2D5C"],["San Pedro de Atacama","#E8892B"],

  ["Mendoza (AR)","#8E2847"],["Buenos Aires (AR)","#7FB2E5"],["Volando / Flying","#9AA5B4"]

const PALETTE = ["#E07A5F","#3D405B","#81B29A","#B5838D","#6D597A","#457B9D","#A8763E","#588157","#BC4749","#264653","#F4A259","#7F5539"];

function placesOn(trip, d){ const out=[]; for(const s of trip.stops){ if(s.place && s.from && s.to && s.from<=d && d<=s.to && !out.includes(s.place.trim())) out.push(s.place.trim()); } return out; }

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    for(const [max,q] of [[1280,0.78],[1000,0.68],[800,0.6]]){
      const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
      if(b && b.size<600000) return b;
    }
  }catch(e){}
  return file;
}

      : el('span',{class:'small muted',text:t('fNoAssets')})].filter(Boolean)); };
  file.addEventListener('change',async()=>{
    const fl=file.files&&file.files[0]; if(!fl) return;
    phMsg.textContent=t('fUploading');
    try{ const blob=await shrink(fl); const type=(blob.type&&/^image\/(jpeg|png|webp|gif)$/.test(blob.type))?blob.type:undefined;
      const r=await S.assets.upload(blob, type?{type}:undefined); photo=r.id; uploaded.push(r.id); phMsg.textContent=''; drawPhoto(); }
    catch(e){ phMsg.textContent=t('fUpErr'); }
    file.value='';
  });
  drawPhoto();
  let nameF,addrF,mapsF,dEsF,dEnF,bEsF,bEnF,tEsF,tEnF;
  const body=el('div',null, el('p',{class:'small muted',text:t('fEnHint')}),
    fld(t('fPhoto'),el('div',null,phBox,file)),
    el('div',{class:'grid2'}, fld(t('fKind'),f.kind), fld(t('fSection'),f.sec), (nameF=fld(t('fName'),f.name)), (addrF=fld(t('fAddress'),f.addr)), (mapsF=fld(t('fMaps'),f.maps)),
      (dEsF=fld(t('fDescEs'),f.dEs)), (dEnF=fld(t('fDescEn'),f.dEn)), (bEsF=fld(t('fBulEs'),f.bEs)), (bEnF=fld(t('fBulEn'),f.bEn)), (tEsF=fld(t('fTagEs'),f.tEs)), (tEnF=fld(t('fTagEn'),f.tEn)), fld(t('fTipEs'),f.tipEs), fld(t('fTipEn'),f.tipEn)));
  const syncKind=()=>{ const d=f.kind.value==='dish';
    [addrF,mapsF,bEsF,bEnF,tEsF,tEnF].forEach(x=>x.hidden=d);
    nameF.querySelector('label').textContent= d?t('fDishName'):t('fName');
    dEsF.querySelector('label').textContent= d?t('fDishDescEs'):t('fDescEs');
    dEnF.querySelector('label').textContent= d?t('fDishDescEn'):t('fDescEn'); };
  f.kind.addEventListener('change',syncKind); syncKind();
  const del = isNew? null : armDelete(el('button',{class:'btn ghost danger small'},t('fDelete')), async()=>{ await deleteItem(it); m.close(); });
  const m=modal(isNew?(it.kind==='dish'?t('gNewDish'):t('gNewItem')):t('gEditItem'), body, async(msg)=>{
    if(!f.name.value.trim()){ msg.textContent=t('edErrName'); return false; }
    const sid=f.sec.value;
    const isDish=f.kind.value==='dish';
    const data={kind:isDish?'dish':'place', section:sid, name:f.name.value.trim().slice(0,80), tag:{es:f.tEs.value.trim(),en:f.tEn.value.trim()}, address:f.addr.value.trim().slice(0,120), maps:(safeUrl(f.maps.value)||''),
      desc:{es:f.dEs.value.trim(),en:f.dEn.value.trim()}, bullets:{es:lines(f.bEs.value),en:lines(f.bEn.value)}, tip:{es:f.tipEs.value.trim(),en:f.tipEn.value.trim()}, photo:photo||'',
      order: (isNew || sid!==it.section)? (Math.max(0,...itemsOf(sid).filter(x=>(x.kind==='dish')===isDish).map(x=>+x.order||0))+10) : (+it.order||0)};
    const ref = isNew? S.db.collection('guide').doc() : S.db.doc('guide/'+it.id);
    await ref.set(data);
    // clean up photos no longer used
    if(S.assets){ for(const id of [oldPhoto,...uploaded]){ if(id && id!==photo && isAssetId(id)){ try{ await S.assets.delete(id); }catch(e){} } } }
  }, del);
}

/* ============ FIREBASE ============ */
// 👉 Pega aquí la configuración de tu proyecto Firebase (Consola → Configuración del proyecto → Tus apps → Web).
const FIREBASE_CONFIG = {
  apiKey: "PEGA_AQUI",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const FB_VER='10.12.2';
async function makeDb(){
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
  const fdb = F.getFirestore(initializeApp(FIREBASE_CONFIG));
  const wrap = d => ({ id:d.id, exists:d.exists(), data:()=>d.data(), metadata:{fromCache:d.metadata.fromCache, hasPendingWrites:d.metadata.hasPendingWrites} });
  const docRef = path => { const r=F.doc(fdb,path); return {
    id:r.id, path,
    get: async()=>wrap(await F.getDoc(r)),
    set: d=>F.setDoc(r,d), update: d=>F.updateDoc(r,d), delete: ()=>F.deleteDoc(r),
    onSnapshot: (n,e)=>F.onSnapshot(r, s=>n(wrap(s)), e)
  }; };
  const colRef = path => ({
    path,
    doc: id => docRef(path+'/'+(id || F.doc(F.collection(fdb,path)).id)),
    onSnapshot: (n,e)=>F.onSnapshot(F.collection(fdb,path), s=>n({docs:s.docs.map(wrap), size:s.size, empty:s.empty, metadata:{fromCache:s.metadata.fromCache}}), e)
  });
  const db = { doc:docRef, collection:colRef };
  const toDataURL = blob => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
  const assets = {
    upload: async (blob)=>{ const data=await toDataURL(blob); if(data.length>950000) throw {code:'too_large'}; const ref=colRef('photos').doc(); await ref.set({data, createdAt:Date.now()}); PH.set(ref.id, Promise.resolve(data)); return {id:ref.id}; },
    delete: async (id)=>{ if(isAssetId(id)) await docRef('photos/'+id).delete(); PH.delete(id); return {deleted:true}; }
  };
  return {db, assets};
}
function myId(){
  let id=null; try{ id=localStorage.getItem('meId'); }catch(e){}
  if(!id){ id='p-'+Math.random().toString(36).slice(2,12); try{ localStorage.setItem('meId',id); }catch(e){} }
  return id;
}
async function initData(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('PEGA')){ S.dbState='nodb'; renderAll(); return; }
  let slowTimer = setTimeout(()=>{ if(S.dbState==='loading'){ S.dbState='slow'; renderWho(); renderEditor(); renderGuide('see'); renderGuide('eat'); renderGuide('tips'); } }, 10000);
  let db, assets;
  try{ ({db,assets} = await makeDb()); }catch(e){ console.error(e); clearTimeout(slowTimer); S.dbState='nodb'; renderAll(); return; }
  S.db=db; S.assets=assets; S.isOwner=true; S.me=myId();
  renderEditor(); renderSettings();
  let gotTrips=false;
  db.collection('trips').onSnapshot(snap=>{
    S.trips = new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id, cleanTrip(d.id, d.data()||{})]));
    if(!snap.metadata.fromCache){ gotTrips=true; clearTimeout(slowTimer); }
    if(gotTrips || S.trips.size) S.dbState='ready';
    renderWho(); if(!dirty) draftFor=undefined; renderEditorIfIdle();
  }, err=>{ console.error(err); clearTimeout(slowTimer); S.dbState='ready'; renderWho(); renderEditor(); });
  let gotSec=false, gotGuide=false;
  const guideDone=()=>{ if(gotSec&&gotGuide){ S.guideLoaded=true; } renderGuide('see'); renderGuide('eat'); renderGuide('tips'); };
  db.collection('sections').onSnapshot(snap=>{ S.sections=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,Object.assign({},d.data()||{},{id:d.id})])); if(!snap.metadata.fromCache) gotSec=true; guideDone(); }, ()=>{ gotSec=true; guideDone(); });
  db.collection('guide').onSnapshot(snap=>{ S.guide=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,Object.assign({},d.data()||{},{id:d.id})])); if(!snap.metadata.fromCache) gotGuide=true; guideDone(); }, ()=>{ gotGuide=true; guideDone(); });
  db.doc('config/main').onSnapshot(snap=>{ S.config = snap.exists ? (snap.data()||{}) : {}; renderCountdown(); renderWho(); renderSettingsIfIdle(); }, ()=>{});
}
// avoid clobbering what someone is typing
function isTypingIn(id){ const a=document.activeElement; return a && $(id).contains(a); }
function renderEditorIfIdle(){ if(!isTypingIn('#editor')) renderEditor(); }
function renderSettingsIfIdle(){ if(!isTypingIn('#settings')) renderSettings(); }

/* ============ boot ============ */
renderAll();
showTab(location.hash.slice(1)||'who');
initData();
</script>
